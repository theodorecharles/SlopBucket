[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slop"
version = "0.1.0"
description = "TUI dashboard for multiple OpenAI Codex / ChatGPT accounts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ted Charles" }]
keywords = ["codex", "chatgpt", "tui"]
dependencies = [
  "textual>=3.0.0",
]

[project.scripts]
slop = "slop.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["slop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
